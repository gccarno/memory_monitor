[package]
name = "memwatch"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_Services",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security",
]

[dev-dependencies]
tempfile = "3"
